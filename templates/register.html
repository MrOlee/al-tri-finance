<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | AL-TRI FINANCE</title>

  <link rel="stylesheet" href="/static/css/style.css">

</head>
<body class="auth-body">

<div class="auth-container">

  <div class="auth-box">

    <h1>Buat Akun</h1>

    <p>
      Daftar akun baru
    </p>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="register-email" placeholder="Masukkan email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="register-password" placeholder="Masukkan password">
    </div>

    <button onclick="register()" class="auth-btn">
      Register
    </button>

    <div class="auth-footer">
      Sudah punya akun?
      <a href="/">Login</a>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="/static/js/supabase.js"></script>

<script src="/static/js/auth.js"></script>

</body>
</html>
